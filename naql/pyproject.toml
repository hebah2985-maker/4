[project]
name = "naql"
version = "0.1.0"
description = "Naql: Scholarly Citation Verifier — محقّق الاقتباس العلمي"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32",
    "PyMuPDF>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "rapidfuzz>=3.6",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
isort = { known-first-party = ["naql_core", "app"] }

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["streamlit.*", "fitz.*", "pytesseract.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
